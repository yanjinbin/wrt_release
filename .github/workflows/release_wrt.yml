name: Release WRT
run-name: Release - ${{ inputs.model }}

permissions:
  actions: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: 设备型号 value（对应关系见 README）
        type: choice
        default: jdcloud_ipq60xx_immwrt
        options:
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
      MIHOMO_VERSION:
        required: false
        description: mihomo 版本
        default: "1.19.27"
      MIHOMO_PLATFORM:
        required: false
        description: mihomo 平台
        default: "arm64"
      NET_MODE:
        required: false
        description: AX6600 网络模式：dhcp/router/pppoe
        type: choice
        default: dhcp
        options: [dhcp, router, pppoe]
      WRT_IP:
        required: false
        description: 管理地址；留空时 dhcp 使用 192.168.2.1，router/pppoe 使用 192.168.1.1
        default: ""
      WRT_PW:
        required: false
        description: root 密码
        default: "666666"
      WRT_SSID:
        required: false
        description: WiFi 名称
        default: "ASUS395"
      WRT_WORD:
        required: false
        description: WiFi 密码
        default: "yjb123456"
      PPPOE_ACCOUNT:
        required: false
        description: PPPoE 账号（NET_MODE=pppoe 时必填）
        default: ""
      PPPOE_PASSWORD:
        required: false
        description: PPPoE 密码（NET_MODE=pppoe 时必填）
        default: ""
      REMARK:
        required: false
        description: 备注说明，写入 Release 正文
        default: ""

concurrency:
  group: wrt-${{ inputs.model }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    steps:
      - name: Fast-fail Inputs
        env:
          MODEL_INPUT: ${{ inputs.model }}
          MIHOMO_VERSION_INPUT: ${{ inputs.MIHOMO_VERSION }}
          MIHOMO_PLATFORM_INPUT: ${{ inputs.MIHOMO_PLATFORM }}
          NET_MODE_INPUT: ${{ inputs.NET_MODE }}
          WRT_IP_INPUT: ${{ inputs.WRT_IP }}
          WRT_PW_INPUT: ${{ inputs.WRT_PW }}
          WRT_SSID_INPUT: ${{ inputs.WRT_SSID }}
          WRT_WORD_INPUT: ${{ inputs.WRT_WORD }}
          PPPOE_ACCOUNT_INPUT: ${{ inputs.PPPOE_ACCOUNT }}
          PPPOE_PASSWORD_INPUT: ${{ inputs.PPPOE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$MODEL_INPUT" == jdcloud_ipq60xx_immwrt || "$MODEL_INPUT" == jdcloud_ipq60xx_libwrt ]] || {
            echo "Release WRT 仅支持京东云 AX6600 雅典娜: $MODEL_INPUT" >&2
            exit 1
          }
          if [[ "$MODEL_INPUT" == jdcloud_ipq60xx_immwrt || "$MODEL_INPUT" == jdcloud_ipq60xx_libwrt ]]; then
            case "$NET_MODE_INPUT" in
              dhcp|router) ;;
              pppoe)
                [[ -n "$PPPOE_ACCOUNT_INPUT" && -n "$PPPOE_PASSWORD_INPUT" ]] || {
                  echo 'NET_MODE=pppoe 时必须同时填写 PPPoE 账号和密码' >&2
                  exit 1
                }
                ;;
              *)
                echo "不支持的 NET_MODE: $NET_MODE_INPUT" >&2
                exit 1
                ;;
            esac

            if [[ -n "$WRT_IP_INPUT" ]]; then
              [[ "$WRT_IP_INPUT" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
                echo "WRT_IP 不是有效的 IPv4 地址: $WRT_IP_INPUT" >&2
                exit 1
              }
              IFS=. read -r -a ip_octets <<< "$WRT_IP_INPUT"
              for octet in "${ip_octets[@]}"; do
                (( 10#$octet <= 255 )) || {
                  echo "WRT_IP 不是有效的 IPv4 地址: $WRT_IP_INPUT" >&2
                  exit 1
                }
              done
            fi

            [[ "$MIHOMO_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "mihomo 版本格式无效: $MIHOMO_VERSION_INPUT" >&2
              exit 1
            }
            [[ "$MIHOMO_PLATFORM_INPUT" =~ ^[a-z0-9._-]+$ ]] || {
              echo "mihomo 平台格式无效: $MIHOMO_PLATFORM_INPUT" >&2
              exit 1
            }

            for value in "$WRT_PW_INPUT" "$WRT_SSID_INPUT" "$WRT_WORD_INPUT" "$PPPOE_ACCOUNT_INPUT" "$PPPOE_PASSWORD_INPUT"; do
              [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
                echo '登录/WiFi/PPPoE 输入不能包含换行' >&2
                exit 1
              }
            done
          fi

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Validate Release Inputs
        env:
          MODEL_INPUT: ${{ inputs.model }}
          MIHOMO_VERSION_INPUT: ${{ inputs.MIHOMO_VERSION }}
          MIHOMO_PLATFORM_INPUT: ${{ inputs.MIHOMO_PLATFORM }}
          NET_MODE_INPUT: ${{ inputs.NET_MODE }}
          WRT_IP_INPUT: ${{ inputs.WRT_IP }}
          WRT_PW_INPUT: ${{ inputs.WRT_PW }}
          WRT_SSID_INPUT: ${{ inputs.WRT_SSID }}
          WRT_WORD_INPUT: ${{ inputs.WRT_WORD }}
          PPPOE_ACCOUNT_INPUT: ${{ inputs.PPPOE_ACCOUNT }}
          PPPOE_PASSWORD_INPUT: ${{ inputs.PPPOE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f "wrt_core/compilecfg/${MODEL_INPUT}.ini"

          if [[ "$MODEL_INPUT" == jdcloud_ipq60xx_immwrt || "$MODEL_INPUT" == jdcloud_ipq60xx_libwrt ]]; then
            case "$NET_MODE_INPUT" in
              dhcp|router) ;;
              pppoe)
                [[ -n "$PPPOE_ACCOUNT_INPUT" && -n "$PPPOE_PASSWORD_INPUT" ]] || {
                  echo 'NET_MODE=pppoe 时必须同时填写 PPPoE 账号和密码' >&2
                  exit 1
                }
                ;;
              *)
                echo "不支持的 NET_MODE: $NET_MODE_INPUT" >&2
                exit 1
                ;;
            esac

            if [[ -n "$WRT_IP_INPUT" ]]; then
              [[ "$WRT_IP_INPUT" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
                echo "WRT_IP 不是有效的 IPv4 地址: $WRT_IP_INPUT" >&2
                exit 1
              }
              IFS=. read -r -a ip_octets <<< "$WRT_IP_INPUT"
              for octet in "${ip_octets[@]}"; do
                (( 10#$octet <= 255 )) || {
                  echo "WRT_IP 不是有效的 IPv4 地址: $WRT_IP_INPUT" >&2
                  exit 1
                }
              done
            fi

            [[ "$MIHOMO_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "mihomo 版本格式无效: $MIHOMO_VERSION_INPUT" >&2
              exit 1
            }
            [[ "$MIHOMO_PLATFORM_INPUT" =~ ^[a-z0-9._-]+$ ]] || {
              echo "mihomo 平台格式无效: $MIHOMO_PLATFORM_INPUT" >&2
              exit 1
            }

            for value in "$WRT_PW_INPUT" "$WRT_SSID_INPUT" "$WRT_WORD_INPUT" "$PPPOE_ACCOUNT_INPUT" "$PPPOE_PASSWORD_INPUT"; do
              [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
                echo '登录/WiFi/PPPoE 输入不能包含换行' >&2
                exit 1
              }
            done
          fi

      - name: Set Build Date and Timezone
        run: |
          set -euo pipefail
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          BUILD_SRC=$(awk -F"=" '/^REPO_URL=/ {print $2; exit}' "./wrt_core/compilecfg/${{ inputs.model }}.ini")
          printf 'BUILD_SRC=%s\n' "$BUILD_SRC" >> "$GITHUB_ENV"

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "=================================================="
          echo "[Memory]"
          free -h
          echo "=================================================="
          echo "[Disk]"
          df -hT
          echo "--------------------------------------------------"
          df -hi
          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "=================================================="

      - name: Build Firmware
        env:
          MIHOMO_VERSION: ${{ inputs.MIHOMO_VERSION }}
          MIHOMO_PLATFORM: ${{ inputs.MIHOMO_PLATFORM }}
          NET_MODE: ${{ inputs.NET_MODE }}
          WRT_IP: ${{ inputs.WRT_IP }}
          WRT_PW: ${{ inputs.WRT_PW }}
          WRT_SSID: ${{ inputs.WRT_SSID }}
          WRT_WORD: ${{ inputs.WRT_WORD }}
          PPPOE_ACCOUNT: ${{ inputs.PPPOE_ACCOUNT }}
          PPPOE_PASSWORD: ${{ inputs.PPPOE_PASSWORD }}
        run: ./build.sh ${{ inputs.model }}

      - name: Get Kernel Verion
        run: |
          set -euo pipefail
          KVER=$(grep -h -oP '^kernel.*' ./firmware/*.manifest 2>/dev/null \
            | grep -oP '[4-6]\.[0-9]{1,3}\.[0-9]{1,3}' \
            | head -n 1 || true)
          if [[ -z "$KVER" ]]; then
            echo '::warning::未能从 manifest 提取内核版本，将使用 unknown-kernel'
            KVER=unknown-kernel
          fi
          printf 'KVER=%s\n' "$KVER" >> "$GITHUB_ENV"

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          cache_keys=$(gh cache list --key ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' || true)
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            gh cache delete "$key" || echo "::warning::无法删除旧缓存，继续发布：$key"
          done <<< "$cache_keys"
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "===================================================="
          echo "[Memory]"
          free -h
          echo "===================================================="
          echo "[Disk]"
          df -hT
          echo "----------------------------------------------------"
          df -hi
          echo "===================================================="
          echo "[Build Outputs]"
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "Firmware file count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
          echo "===================================================="

      - name: Package Kmods
        run: |
          if [ ! -d "./action_build/bin" ]; then
            echo "kmod source directory not found: ./action_build/bin" >&2
            exit 1
          fi

          KMOD_LIST=$(mktemp)
          trap 'rm -f "$KMOD_LIST"' EXIT

          (
            cd ./action_build/bin
            find . -type f \( -name "kmod*.ipk" -o -name "kmod*.apk" \) -print | sort > "$KMOD_LIST"
          )

          if [ ! -s "$KMOD_LIST" ]; then
            echo "No kmod packages found under ./action_build/bin" >&2
            exit 1
          fi

          kmod_count=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')
          archive_name="kmods_${{ inputs.model }}_${KVER:-unknown-kernel}_${BUILD_DATE}.tar.gz"
          tar -C ./action_build/bin -czf "$archive_name" -T "$KMOD_LIST"

          echo "KMOD_ARCHIVE=$archive_name" >> "$GITHUB_ENV"
          echo "Packaged $kmod_count kmod packages into $archive_name"

      - name: Package OpenWrt Firmware
        if: ${{ inputs.model == 'n1_immwrt' }}
        uses: unifreq/openwrt_packit@8007d3efd49bb42aa20c5755a50af21dc7a438e1
        env:
          OPENWRT_ARMVIRT: firmware/*.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: 6.6.y
          WHOAMI: ZqinKing

      - name: Prepare Release Body
        env:
          REMARK: ${{ inputs.REMARK }}
          MODEL_INPUT: ${{ inputs.model }}
          WRT_IP_INPUT: ${{ inputs.WRT_IP }}
          NET_MODE_INPUT: ${{ inputs.NET_MODE }}
          WRT_PW_INPUT: ${{ inputs.WRT_PW }}
          WRT_SSID_INPUT: ${{ inputs.WRT_SSID }}
          WRT_WORD_INPUT: ${{ inputs.WRT_WORD }}
          MIHOMO_VERSION_INPUT: ${{ inputs.MIHOMO_VERSION }}
          MIHOMO_PLATFORM_INPUT: ${{ inputs.MIHOMO_PLATFORM }}
        run: |
          set -euo pipefail
          model="$MODEL_INPUT"
          lan_ip="$WRT_IP_INPUT"
          net_mode="$NET_MODE_INPUT"
          if [[ "$model" == jdcloud_ipq60xx_immwrt || "$model" == jdcloud_ipq60xx_libwrt ]]; then
            if [[ -z "$lan_ip" ]]; then
              if [[ "$net_mode" == dhcp ]]; then lan_ip='192.168.2.1'; else lan_ip='192.168.1.1'; fi
            fi
          else
            lan_ip='192.168.1.1'
          fi
          {
            echo "云编译发布"
            echo "源码：${BUILD_SRC}"
            echo "Kernel: ${KVER}"
            echo ""
            echo "## 设备与平台/固件信息"
            if [[ "$model" == jdcloud_ipq60xx_immwrt || "$model" == jdcloud_ipq60xx_libwrt ]]; then
              echo "设备型号：京东云无线宝 AX6600 雅典娜 · 1G RAM · 128G EMMC · Quad-core ARM Cortex-A53 @ 1.8GHz"
              echo "硬件平台：Qualcomm IPQ6010 / IPQ60xx"
              echo "mihomo：v${MIHOMO_VERSION_INPUT} / ${MIHOMO_PLATFORM_INPUT}"
              echo "网络模式：${net_mode}；LAN 管理地址：${lan_ip}"
              echo "管理用户名：root"
              echo "管理密码：${WRT_PW_INPUT}"
              echo "WiFi 名称：${WRT_SSID_INPUT}"
              echo "WiFi 密码：${WRT_WORD_INPUT}"
              echo ""
              echo "## 刷机教程"
              echo "- 恩山论坛：https://www.right.com.cn/forum/thread-8429666-1-1.html"
              echo "- 免拆刷机指南：https://router-docs-sepia.vercel.app/jdcloud-athena-ax6600-flashing.html"
            else
              echo "LAN地址：${lan_ip}"
            fi
            echo "KMOD归档：${KMOD_ARCHIVE}"
            echo ""
            echo "## AX6600 预装插件与魔改"
            if [[ "$model" == jdcloud_ipq60xx_immwrt || "$model" == jdcloud_ipq60xx_libwrt ]]; then
              for package in \
                luci-app-emmc-health \
                luci-app-bandix \
                luci-app-quickfile \
                luci-app-statistics \
                luci-app-ttyd \
                luci-app-package-manager \
                luci-app-partexp; do
                if grep -q "$package" ./firmware/*.manifest; then
                  echo "- $package"
                else
                  echo "- $package（manifest 未检测到）"
                fi
              done
              echo "- luci-app-nikki + mihomo v${MIHOMO_VERSION_INPUT}（${MIHOMO_PLATFORM_INPUT}）"
              echo "- 默认主题：luci-theme-openwrt；保留 uniwrt/footstrap/bootstrap 兜底主题"
              echo "- AX6600 三种网络模式、默认登录/WiFi、设备信息、NSS/Nikki 注意事项"
            else
              grep -oP 'luci-app(-[a-zA-Z0-9]{1,}){1,}' ./firmware/*.manifest | awk -F: '{print $NF}' || true
            fi
            if [[ -n "$REMARK" ]]; then
              echo ""
              echo "## 备注"
              printf '%s\n' "$REMARK"
            fi
          } > release_body.txt

      - name: Release Firmware
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model }}
          files: |
            ${{ inputs.model == 'n1_immwrt' && env.PACKAGED_OUTPUTPATH || './firmware' }}/*.*
            ./kmods_*.tar.gz
          fail_on_unmatched_files: true
          body_path: ./release_body.txt
